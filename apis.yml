aid: nevis
name: Nevis
description: >-
  Nevis (Nevis Security AG) is a Swiss customer identity and access management
  (CIAM) and passwordless authentication provider. Its Authentication Cloud adds
  passwordless login and transaction signing to applications using FIDO2
  passkeys, the Nevis Access App device authenticator, OATH TOTP, SMS OTP and
  recovery codes, exposed through a versioned REST API and native iOS / Android
  Mobile Authentication SDKs. Nevis also offers the on-premises Identity Suite
  and Nevis ID, serving banks, insurers and government with secure, standards-based
  (FIDO2 / WebAuthn) authentication.
