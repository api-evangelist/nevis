- name: Nevis Authentication Cloud REST API
  description: >-
    REST API to automate the Nevis Authentication Cloud — passwordless
    registration, authentication and transaction signing (FIDO2 / passkeys,
    Access App, OATH TOTP, SMS OTP, recovery codes), user and authenticator
    management, token introspection, and audit log export. Served per instance
    (tenant) and versioned under /api/v1.
